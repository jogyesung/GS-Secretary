<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cip-gray-600);font-weight:700;margin-bottom:14px;}
.row{display:flex;gap:16px;align-items:flex-end}
.box{background:#1C3664;width:70px;height:70px;display:flex;align-items:flex-end;justify-content:center;color:#fff;padding-bottom:8px;font-family:var(--font-mono);font-size:10px}
.cap{font-size:10px;color:var(--cip-gray-600);text-align:center;margin-top:6px;letter-spacing:.06em;text-transform:uppercase}
.col{display:flex;flex-direction:column;align-items:center}
</style></head>
<body>
<div class="label">Radii — restrained (corporate)</div>
<div class="row">
  <div class="col"><div class="box" style="border-radius:0">0</div><div class="cap">sharp</div></div>
  <div class="col"><div class="box" style="border-radius:2px">2</div><div class="cap">sm</div></div>
  <div class="col"><div class="box" style="border-radius:4px">4</div><div class="cap">md</div></div>
  <div class="col"><div class="box" style="border-radius:8px">8</div><div class="cap">lg</div></div>
  <div class="col"><div class="box" style="border-radius:999px;width:140px">pill</div><div class="cap">pill (status only)</div></div>
</div>
</body></html>
