<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cip-gray-600);font-weight:700;margin-bottom:14px;}
.chart{display:flex;align-items:flex-end;gap:14px;height:140px;}
.bar{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;}
.b{width:100%;background:#1C3664;position:relative;}
.b span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;color:#1C3664;font-weight:700;}
.lab{font-size:10px;color:var(--cip-gray-600);font-family:var(--font-mono);}
.legend{display:flex;gap:14px;margin-top:16px;font-size:11px;color:var(--cip-gray-900);}
.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:middle;}
</style></head>
<body>
<div class="label">Chart — 4-colour data ramp</div>
<div class="chart">
  <div class="bar"><div class="b" style="height:18%;background:#1C3664"><span>31</span></div><div class="lab">2024</div></div>
  <div class="bar"><div class="b" style="height:28%;background:#1664AA"><span>44</span></div><div class="lab">2025</div></div>
  <div class="bar"><div class="b" style="height:42%;background:#26ACF1"><span>64</span></div><div class="lab">2026F</div></div>
  <div class="bar"><div class="b" style="height:62%;background:#7FCDF5"><span>90</span></div><div class="lab">2027F</div></div>
  <div class="bar"><div class="b" style="height:86%;background:#BEE7FB;color:#1C3664;"><span style="color:#1C3664">126</span></div><div class="lab">2028F</div></div>
</div>
<div class="legend">
  <span><span class="dot" style="background:#1C3664"></span>Navy</span>
  <span><span class="dot" style="background:#1664AA"></span>Blue</span>
  <span><span class="dot" style="background:#26ACF1"></span>Cyan</span>
  <span><span class="dot" style="background:#BEE7FB"></span>Tint</span>
</div>
</body></html>
