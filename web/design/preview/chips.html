<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cip-gray-600);font-weight:700;margin-bottom:14px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{font-size:12px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:999px;}
.g{background:#E9EEF5;color:#1C3664}
.pos{background:#E1F3EF;color:#008C72}
.neg{background:#FBE8E8;color:#C00000}
.neg2{background:#F6E5D9;color:#B34700}
.accent{background:#BEE7FB;color:#1C3664}
.delta{font-family:var(--font-sans);font-weight:700;font-size:14px;}
.delta.up{color:#008C72}
.delta.down{color:#C00000}
</style></head>
<body>
<div class="label">Status chips &amp; deltas</div>
<div class="row">
  <span class="chip g">Draft</span>
  <span class="chip pos">Closed</span>
  <span class="chip neg">At risk</span>
  <span class="chip neg2">Delayed</span>
  <span class="chip accent">Highlight</span>
  <span class="delta up">+33%</span>
  <span class="delta up">+56%</span>
  <span class="delta down">−12%</span>
</div>
</body></html>
