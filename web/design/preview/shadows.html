<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:28px;background:#F7F8FA;font-family:var(--font-sans);}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cip-gray-600);font-weight:700;margin-bottom:18px;}
.row{display:flex;gap:20px;}
.card{flex:1;background:#fff;padding:16px;border-radius:2px;}
.name{font-size:11px;font-weight:700;color:var(--cip-navy);letter-spacing:.06em;text-transform:uppercase;}
.h{font-family:var(--font-mono);font-size:10px;color:var(--cip-gray-600);margin-top:6px;line-height:1.4}
.c1{box-shadow:var(--shadow-flat);border:1px solid #D2D2D2;}
.c2{box-shadow:var(--shadow-card);}
.c3{box-shadow:var(--shadow-pop);}
</style></head>
<body>
<div class="label">Shadows &amp; elevation</div>
<div class="row">
  <div class="card c1"><div class="name">Flat</div><div class="h">0 1px 0 rgba(0,0,0,.06) +<br>1px border</div></div>
  <div class="card c2"><div class="name">Card</div><div class="h">0 3px 4px rgba(0,0,0,.16)<br>source default</div></div>
  <div class="card c3"><div class="name">Pop</div><div class="h">0 8px 24px rgba(28,54,100,.18)</div></div>
</div>
</body></html>
