<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
html,body{margin:0;padding:0;width:1280px;height:720px;overflow:hidden;background:#fff;font-family:var(--font-sans);}
.slide{position:relative;width:1280px;height:720px;padding:70px;box-sizing:border-box}
.head{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:1px solid #D2D2D2;padding-bottom:18px;margin-bottom:36px;}
.head .t{font-size:36px;font-weight:700;color:#1C3664;letter-spacing:.02em;text-transform:uppercase;border-left:3px solid #1C3664;padding-left:16px;line-height:1}
.head img{height:34px;opacity:.9}
.toc{display:grid;grid-template-columns:60px 1fr;row-gap:26px;column-gap:24px;font-size:20px;color:#1C3664;}
.toc .n{color:#26ACF1;font-weight:700}
.toc .row{display:contents;}
.toc .t{font-weight:700;color:#1C3664}
.toc .subs{grid-column:2;margin-top:8px;margin-left:18px;display:grid;grid-template-columns:40px 1fr;row-gap:10px;font-size:15px;color:#4D4D4D;font-weight:400}
.toc .subs .sn{color:#797979}
.footer{position:absolute;left:70px;right:70px;bottom:26px;display:flex;justify-content:space-between;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#797979;font-weight:700;border-top:1px solid #D2D2D2;padding-top:12px;}
.pg{width:22px;height:22px;border-radius:999px;background:#797979;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;letter-spacing:0;}
</style></head>
<body>
<div class="slide" data-screen-label="02 TOC">
  <div class="head">
    <div class="t">Table of Contents</div>
    <img src="../assets/centroid_logo_horizontal.png" alt="">
  </div>
  <div class="toc">
    <div class="n">1.</div><div class="t">Executive Summary</div>
    <div class="n">2.</div>
    <div>
      <div class="t">Investment Highlight</div>
      <div class="subs">
        <span class="sn">2-1</span><span>Market Position</span>
        <span class="sn">2-2</span><span>Financial Performance</span>
        <span class="sn">2-3</span><span>Growth Strategy</span>
        <span class="sn">2-4</span><span>Management &amp; Operations</span>
      </div>
    </div>
    <div class="n">3.</div><div class="t">Exit / Return Analysis</div>
    <div class="n">4.</div><div class="t">Appendices</div>
  </div>
  <div class="footer"><span>Strictly Confidential</span><span class="pg">2</span></div>
</div>
</body></html>
