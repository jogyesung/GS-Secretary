<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cip-gray-600);font-weight:700;margin-bottom:14px;}
.row{display:flex;align-items:baseline;gap:14px;margin-bottom:12px;}
.tag{font-family:var(--font-mono);font-size:10px;color:var(--cip-gray-400);width:92px;flex:none;}
.latin{font-family:var(--font-latin);color:var(--cip-navy);font-weight:700;line-height:1;letter-spacing:.01em;}
.ko{font-family:var(--font-korean);color:var(--cip-navy);font-weight:400;line-height:1;letter-spacing:.005em;}
.sub{font-size:9px;color:var(--cip-gray-400);font-family:var(--font-mono);margin-left:8px;vertical-align:middle;}
</style></head>
<body>
<div class="label">Display — Latin Arial Bold · Korean SHeadG (가는각진제목체)</div>
<div class="row"><span class="tag">60 / Display</span><span class="latin" style="font-size:50px">Centroid</span></div>
<div class="row"><span class="tag">60 / Display KR</span><span class="ko" style="font-size:50px">센트로이드</span></div>
<div class="row"><span class="tag">34 / H1</span><span class="latin" style="font-size:28px">Executive Summary</span></div>
<div class="row"><span class="tag">34 / H1 KR</span><span class="ko" style="font-size:28px">투자 개요</span></div>
<div class="row"><span class="tag">22 / H2 KR</span><span class="ko" style="font-size:20px">가는각진제목체 · 투자 하이라이트</span></div>
</body></html>
