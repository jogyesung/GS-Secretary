<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cip-gray-600);font-weight:700;margin-bottom:14px;}
.row{display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:12px;color:var(--cip-gray-800);}
.bar{background:#1C3664;height:14px;}
.tag{width:72px;font-family:var(--font-mono);color:var(--cip-gray-400);font-size:11px;}
.val{color:var(--cip-gray-600);font-family:var(--font-mono);font-size:11px;}
</style></head>
<body>
<div class="label">Spacing — 4px grid</div>
<div class="row"><span class="tag">space-1</span><div class="bar" style="width:4px"></div><span class="val">4px</span></div>
<div class="row"><span class="tag">space-2</span><div class="bar" style="width:8px"></div><span class="val">8px</span></div>
<div class="row"><span class="tag">space-3</span><div class="bar" style="width:12px"></div><span class="val">12px</span></div>
<div class="row"><span class="tag">space-4</span><div class="bar" style="width:16px"></div><span class="val">16px</span></div>
<div class="row"><span class="tag">space-5</span><div class="bar" style="width:24px"></div><span class="val">24px</span></div>
<div class="row"><span class="tag">space-6</span><div class="bar" style="width:32px"></div><span class="val">32px</span></div>
<div class="row"><span class="tag">space-7</span><div class="bar" style="width:48px"></div><span class="val">48px</span></div>
<div class="row"><span class="tag">space-8</span><div class="bar" style="width:64px"></div><span class="val">64px</span></div>
</body></html>
