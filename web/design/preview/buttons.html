<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cip-gray-600);font-weight:700;margin-bottom:14px;}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.btn{font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.04em;padding:10px 20px;border:none;border-radius:2px;cursor:pointer;}
.btn.primary{background:#1C3664;color:#fff}
.btn.primary:hover{background:#0f2549}
.btn.secondary{background:#fff;color:#1C3664;border:1.5px solid #1C3664}
.btn.ghost{background:transparent;color:#1C3664;padding:10px 6px}
.btn.ghost:hover{text-decoration:underline}
.btn.neg{background:#C00000;color:#fff}
.btn.pos{background:#008C72;color:#fff}
</style></head>
<body>
<div class="label">Buttons</div>
<div class="row">
  <button class="btn primary">Primary action</button>
  <button class="btn secondary">Secondary</button>
  <button class="btn ghost">Tertiary →</button>
  <button class="btn pos">Confirm</button>
  <button class="btn neg">Destructive</button>
</div>
</body></html>
