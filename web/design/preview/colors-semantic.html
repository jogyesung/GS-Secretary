<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
.row{display:flex;gap:10px;}
.sw{flex:1;aspect-ratio:1.1/1;border-radius:2px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;color:#fff}
.sw .n{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.95;}
.sw .h{font-family:var(--font-mono);font-size:12px;margin-top:2px;opacity:.85;}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cip-gray-600);font-weight:700;margin-bottom:8px;}
</style></head>
<body>
<div class="label">Semantic — Positive / Negative</div>
<div class="row">
  <div class="sw" style="background:#008C72"><div class="n">Positive #1</div><div class="h">#008C72</div></div>
  <div class="sw" style="background:#7030A0"><div class="n">Positive #2</div><div class="h">#7030A0</div></div>
  <div class="sw" style="background:#C00000"><div class="n">Negative #1</div><div class="h">#C00000</div></div>
  <div class="sw" style="background:#B34700"><div class="n">Negative #2</div><div class="h">#B34700</div></div>
</div>
</body></html>
