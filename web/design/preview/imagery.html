<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cip-gray-600);font-weight:700;margin-bottom:12px;}
.row{display:flex;gap:12px;}
.shot{flex:1;aspect-ratio:4/3;background-size:cover;background-position:center;position:relative;overflow:hidden;}
.cap{position:absolute;bottom:8px;left:10px;color:#fff;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.4);}
</style></head>
<body>
<div class="label">Imagery — cool, glass, architectural</div>
<div class="row">
  <div class="shot" style="background-image:url(../assets/hero_ifc_seoul.jpeg)"><div class="cap">IFC Seoul · cover</div></div>
  <div class="shot" style="background:linear-gradient(180deg,#BEE7FB 0%, #1664AA 100%)"><div class="cap">Sky wash · placeholder</div></div>
  <div class="shot" style="background:#1C3664"><div class="cap">Navy fill · section</div></div>
</div>
</body></html>
