<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans);}
.row{display:flex;gap:10px;}
.sw{flex:1;aspect-ratio:1.1/1;border-radius:2px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
.sw .n{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.sw .h{font-family:var(--font-mono);font-size:12px;margin-top:2px;opacity:.85;}
.label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cip-gray-600);font-weight:700;margin-bottom:8px;}
</style></head>
<body>
<div class="label">Sub — Neutrals</div>
<div class="row">
  <div class="sw" style="background:#4D4D4D;color:#fff"><div class="n">Body</div><div class="h">#4D4D4D</div></div>
  <div class="sw" style="background:#444444;color:#fff"><div class="n">Sub 1</div><div class="h">#444444</div></div>
  <div class="sw" style="background:#797979;color:#fff"><div class="n">Sub 2</div><div class="h">#797979</div></div>
  <div class="sw" style="background:#A6A6A6;color:#fff"><div class="n">Sub 3</div><div class="h">#A6A6A6</div></div>
  <div class="sw" style="background:#D2D2D2;color:#1C3664"><div class="n">Sub 4</div><div class="h">#D2D2D2</div></div>
  <div class="sw" style="background:#F2F2F2;color:#1C3664;border:1px solid #D2D2D2"><div class="n">Wash</div><div class="h">#F2F2F2</div></div>
</div>
</body></html>
